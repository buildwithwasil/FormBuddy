<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormBuddy AI</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --border: #2d2d4e;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    /* Header */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 11px; color: var(--muted); }
    .settings-btn {
      margin-left: auto; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px;
    }

    /* Status bar */
    .status-bar {
      padding: 8px 16px;
      background: rgba(99,102,241,0.1);
      border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-green { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot-yellow { background: var(--warning); }
    .dot-red { background: var(--danger); }

    /* Main content */
    .content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border-radius: 8px; font-weight: 600;
      font-size: 14px; border: none; cursor: pointer; width: 100%;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); }
    .btn-sm { padding: 7px 12px; font-size: 12px; width: auto; }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }

    /* Field scan results */
    .field-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
    .field-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px; background: rgba(99,102,241,0.08);
      font-size: 12px;
    }
    .field-badge {
      padding: 2px 6px; border-radius: 4px; font-size: 10px;
      font-weight: 600; background: rgba(99,102,241,0.2); color: var(--primary);
      flex-shrink: 0;
    }
    .field-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-match { font-size: 11px; color: var(--success); flex-shrink: 0; }
    .field-skip { font-size: 11px; color: var(--muted); flex-shrink: 0; }

    /* Result summary */
    .result {
      padding: 12px 14px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .result-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); }
    .result-warn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
    .result-icon { font-size: 20px; }
    .result-text { font-size: 13px; font-weight: 600; }
    .result-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Profile preview */
    .profile-row {
      display: flex; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-key { color: var(--muted); }
    .profile-val { font-weight: 500; text-align: right; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tabs */
    .tabs { display: flex; gap: 2px; background: var(--card); border-radius: 8px; padding: 3px; }
    .tab {
      flex: 1; padding: 7px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 12px; font-weight: 600; font-family: inherit;
      background: transparent; color: var(--muted); transition: all 0.15s;
    }
    .tab.active { background: var(--primary); color: white; }

    /* Setup link */
    .setup-link {
      text-align: center; font-size: 12px; color: var(--muted);
      padding: 8px;
    }
    .setup-link a { color: var(--primary); cursor: pointer; }

    /* Source tag */
    .source-tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      background: rgba(99,102,241,0.15); color: var(--primary);
      font-weight: 600; margin-left: auto;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">✦</div>
  <div>
    <div class="header-title">FormBuddy AI</div>
    <div class="header-sub">Smart Form Auto-Fill</div>
  </div>
  <button class="settings-btn" id="btn-settings" title="Settings">⚙</button>
</div>

<!-- Status -->
<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Checking page…</span>
  <span id="source-tag" class="source-tag" style="display:none"></span>
</div>

<!-- Tabs -->
<div style="padding: 12px 16px 0;">
  <div class="tabs">
    <button class="tab active" data-tab="fill">🪄 Auto-Fill</button>
    <button class="tab" data-tab="profile">👤 Profile</button>
  </div>
</div>

<!-- Content -->
<div class="content">

  <!-- FILL TAB -->
  <div id="tab-fill">
    <!-- Scan result -->
    <div id="scan-result" style="display:none" class="card">
      <div class="card-title">Detected Fields <span id="field-count-badge" style="color:var(--primary)"></span></div>
      <div class="field-list" id="field-list"></div>
    </div>

    <!-- No form msg -->
    <div id="no-form-msg" class="card" style="text-align:center; color:var(--muted); display:none;">
      <div style="font-size:28px; margin-bottom:8px;">📋</div>
      <div style="font-weight:600; color:var(--text); margin-bottom:4px;">No form detected</div>
      <div style="font-size:12px;">Navigate to a page with a form, then click Scan.</div>
    </div>

    <!-- No profile warning -->
    <div id="no-profile-warn" class="result result-warn" style="display:none;">
      <span class="result-icon">⚠️</span>
      <div>
        <div class="result-text">Profile not set up</div>
        <div class="result-sub">Add your details to enable auto-fill.</div>
      </div>
    </div>

    <!-- Fill result -->
    <div id="fill-result" style="display:none"></div>

    <!-- Action buttons -->
    <button class="btn btn-secondary" id="btn-scan">🔍 Scan Form Fields</button>
    <button class="btn btn-primary" id="btn-fill" disabled>✦ Fill Form with AI</button>
  </div>

  <!-- PROFILE TAB -->
  <div id="tab-profile" style="display:none">
    <div class="card" id="profile-preview">
      <div class="card-title">Saved Profile</div>
      <div id="profile-rows" style="color:var(--muted); font-size:12px; text-align:center; padding:12px 0;">
        No profile saved yet.
      </div>
    </div>
    <button class="btn btn-secondary" id="btn-open-setup">✏️ Edit Profile</button>
    <div style="border-top:1px solid var(--border); padding-top:12px;">
      <div class="card-title" style="margin-bottom:8px;">Gemini API Key</div>
      <input id="api-key-input" type="password" placeholder="AIza…"
        style="width:100%; padding:9px 12px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:13px; outline:none;" />
      <button class="btn btn-secondary" id="btn-save-key" style="margin-top:8px; padding:8px;">💾 Save API Key</button>
      <div style="font-size:11px; color:var(--muted); margin-top:6px;">
        Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--primary);">aistudio.google.com</a>
      </div>
    </div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
